# Kustomize overlay for auth i dev miljø
# Overlays tilføjer miljøspecifikke ændringer oven på base
# Kan overskrive værdier, tilføje patches, ændre namespace, etc.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespace: Alle resources i denne overlay får dette namespace
# Overskriver eventuelle namespaces i base
namespace: dev
# resources: Reference til base konfiguration
# ../../base peger på apps/auth/base/
resources:
  - ../../base
# images: Overskriver container images fra base
# Flux Image Automation opdaterer automatisk newTag baseret på ImagePolicy
images:
  - name: ghcr.io/mtbonde/hagi-authservice
    newName: ghcr.io/mtbonde/hagi-authservice
    newTag: ghcr.io/mtbonde/hagi-authservice:0.5.17 # {"$imagepolicy": "flux-system:auth"}

# Her kan tilføjes patches for miljøspecifikke ændringer:
# patches:
#   - patch: |-
#       - op: replace
#         path: /spec/replicas
#         value: 2
#     target:
#       kind: Deployment
#       name: auth
