# Gameserver Deployment - Unreal Engine dedicated server
# Se apps/auth/base/deployment.yaml for detaljerede kommentarer

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gameserver
  template:
    metadata:
      labels:
        app: gameserver
        alexor-service: "true"
    spec:
      containers:
      - name: gameserver
        image: ghcr.io/alexanderlind98/unrealmp_server:1.6.4 # {"$imagepolicy": "flux-system:gameserver"}
        ports:
        - containerPort: 7777
          protocol: UDP           # UDP for game traffic (lavere latency)
          name: game-udp
        # Port 8080 fjernet - Unreal eksponerer ikke HTTP endpoint
        # Health monitoring håndteres af Registry via heartbeat

        # env: Environment variabler til containeren
        # Konfigurerer gameserver uden at ændre image
        env:
        - name: SERVER_HOST
          value: "127.0.0.1"        # Lyt på alle interfaces
        - name: SERVER_PORT
          value: "7777"
        - name: REGISTRY_URL
          value: "http://registry:8080"    # Service discovery via DNS
        - name: REGISTRY_ENDPOINT
          value: "/api/v0.3.0/Registry/register"

        # Kubernetes probes fravalgt bevidst:
        # - Unreal server eksponerer kun UDP, ingen HTTP/TCP health endpoint
        # - Registry håndterer health via heartbeat og player count
        # - Hvis processen crasher, dør containeren og K8s restarter automatisk
