# Registry Deployment - Game server registrering
# Gameservere registrerer sig her så klienter kan finde dem
# Se apps/auth/base/deployment.yaml for detaljerede kommentarer

apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
        alexor-service: "true"
    spec:
      serviceAccountName: registry-service-account
      containers:
      - name: registry
        image: ghcr.io/mtbonde/hagi-registryservice:0.6.5 # {"$imagepolicy": "flux-system:registry"}
        ports:
        - containerPort: 8080
        startupProbe:
          tcpSocket:
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
