
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-service-account
  # namespace sættes automatisk af Kustomize overlays (dev/staging/prod)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-gameserver-scaler
  # namespace sættes automatisk af Kustomize overlays (dev/staging/prod)
rules:
  # Permission til at skalere gameserver Deployment
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["gameserver"]  # Kun denne specifikke Deployment
    verbs: ["get", "update", "patch"]  # update nødvendig for ReplaceNamespacedDeploymentScaleAsync (PUT)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-gameserver-scaler-binding
  # namespace sættes automatisk af Kustomize overlays (dev/staging/prod)
subjects:
  - kind: ServiceAccount
    name: registry-service-account
    # namespace reference sættes af Kustomize
roleRef:
  kind: Role
  name: registry-gameserver-scaler
  apiGroup: rbac.authorization.k8s.io