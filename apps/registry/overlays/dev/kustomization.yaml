# Kustomize overlay for registry i dev miljø
# Se apps/auth/overlays/dev/kustomization.yaml for detaljerede kommentarer

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base

images:
  - name: ghcr.io/mtbonde/hagi-registryservice
    newName: ghcr.io/mtbonde/hagi-registryservice
    newTag: 0.3.0 # {"$imagepolicy": "flux-system:registry"}
