# Kustomize konfiguration for prod miljø
# Denne fil samler alle resources der skal deployes til prod cluster
# Kustomize merger alle refererede filer til én samlet YAML output

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# resources: Liste af filer/mapper der skal inkluderes
# Rækkefølgen er vigtig - infrastructure først, så services
resources:
  # Flux system komponenter (GitOps controller)
  - flux-system

  # Namespace - skal oprettes først
  - namespace.yaml

  # Infrastructure - skal deployes først da services afhænger af dem
  - ../../apps/rabbitmq/overlays/prod
  - ../../apps/redis/overlays/prod

  # Platform services - afhænger af infrastructure
  - ../../apps/auth/overlays/prod
  - ../../apps/registry/overlays/prod
  - ../../apps/relay/overlays/prod
  - ../../apps/session/overlays/prod
  - ../../apps/gameserver/overlays/prod
