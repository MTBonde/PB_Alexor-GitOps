# Kustomize konfiguration for staging miljø
# Denne fil samler alle resources der skal deployes til staging cluster
# Kustomize merger alle refererede filer til én samlet YAML output

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# resources: Liste af filer/mapper der skal inkluderes
# Rækkefølgen er vigtig - infrastructure først, så services
resources:
  # Flux system komponenter (GitOps controller)
  - flux-system

  # Flux Image Automation - automatisk image opdateringer
  - image-automation

  # Namespace - skal oprettes først
  - namespace.yaml

  # Infrastructure - skal deployes først da services afhænger af dem
  - ../../apps/rabbitmq/overlays/staging
  - ../../apps/redis/overlays/staging
  - ../../monitoring/overlays/staging    # Monitoring stack (Prometheus + Grafana)

  # Platform services - afhænger af infrastructure
  - ../../apps/auth/overlays/staging
  - ../../apps/registry/overlays/staging
  - ../../apps/relay/overlays/staging
  - ../../apps/session/overlays/staging
  - ../../apps/gameserver/overlays/staging
