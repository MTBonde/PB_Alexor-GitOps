---
# ClusterRole for at tillade Prometheus at scrape metrics fra alle namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-cross-namespace-scraper
rules:
  # Tillad at læse pods, services og endpoints i alle namespaces
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  # Tillad at læse non-resource URLs (metrics endpoints)
  - nonResourceURLs:
      - /metrics
      - /metrics/cadvisor
    verbs: ["get"]
  # Tillad at læse ingresses for monitoring
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  # Tillad at læse ConfigMaps (for service discovery)
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
---
# ClusterRoleBinding for at give Prometheus serviceaccount adgang
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-cross-namespace-scraper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-cross-namespace-scraper
subjects:
  - kind: ServiceAccount
    name: kube-prometheus-stack-prometheus
    namespace: monitoring
